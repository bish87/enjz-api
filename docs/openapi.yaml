        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: NewPassw0rd!

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          example: Passw0rd!
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: NewPassw0rd!

