        verifiedAt:
          type: [string, "null"]
          format: date-time
          example: "2026-11-01T10:00:00.000Z"
        ratingAvg:
          type: number
          format: float
          example: 4.8
        ratingCount:
          type: integer
          example: 12
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ProviderCategory"
        areas:
          type: array
          items:
            $ref: "#/components/schemas/Area"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-28T09:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-01T10:00:00.000Z"

    ProviderAdminResponse:
      type: object
