          $ref: "#/components/schemas/ProviderPublic"

    AdminUser:
      type: object
      required: [id, firstName, phone, city, status]
      properties:
        id:
          type: integer
          example: 7
        firstName:
          type: string
          example: Sara
        lastName:
          type: [string, "null"]
          example: Hassan
        phone:
          type: string
          example: "+249912345679"
        email:
          type: [string, "null"]
          format: email
          example: sara@example.com
        avatar:
          type: [string, "null"]
          format: uri
          example: null
        city:
          type: string
          example: Omdurman
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, PENDING]
          example: ACTIVE

    ProviderAdmin:
      type: object
      required:
        [
          id,
          user,
          isAvailable,
          verificationStatus,
          ratingAvg,
          ratingCount,
          categories,
          areas,
        ]
