                example: 15000

    ProviderAreasRequest:
      type: object
      required: [areaIds]
      properties:
        areaIds:
          type: array
          maxItems: 20
          items:
            type: integer
            minimum: 1
          example: [1, 2]

    BookingCreateRequest:
      type: object
      required:
        [providerId, categoryId, areaId, address, description, scheduledAt]
      properties:
        providerId:
          type: integer
          minimum: 1
          example: 7
        categoryId:
          type: integer
          minimum: 1
          example: 1
        areaId:
          type: integer
          minimum: 1
          example: 1
        address:
          type: string
          minLength: 5
          maxLength: 255
          example: Street 12, Khartoum
        description:
          type: string
          minLength: 5
          maxLength: 1000
          example: Leaking kitchen sink
        scheduledAt:
          type: string
          format: date-time
          description: Must be in the future.
          example: "2026-11-10T09:00:00.000Z"

    AcceptBookingRequest:
      type: object
      properties:
        agreedPrice:
          type: integer
          minimum: 0
          maximum: 100000000
          description: Agreed price in whole SDG.
          example: 18000

    BookingReasonRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          example: Already booked for that time.

    ReviewCreateRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: [string, "null"]
          maxLength: 500
          example: Arrived on time and fixed the leak quickly.

    VerificationRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
