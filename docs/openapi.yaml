openapi: 3.1.0
info:
  title: enjz API
  version: 1.0.0
  description: |
    REST API for the enjz home-services platform.

    The API supports customer and provider accounts, service categories and
    coverage areas, provider discovery, bookings, reviews, and administrative
    moderation.

    ## Authentication

    Protected endpoints use a bearer token returned by `POST /auth/login` or
    `POST /auth/register`:

    ```http
    Authorization: Bearer <token>
    ```

    Tokens expire after 7 days. Logging out, changing a password, resetting a
    password, or an administrator resetting a password revokes every existing
    token for that account.

    ## Errors

    Standard errors return:

    ```json
    { "message": "Human-readable error message" }
    ```

    Validation errors additionally include field-level details:

    ```json
    {
      "message": "Validation failed",
      "errors": [{ "path": "phone", "message": "Invalid phone number" }]
    }
    ```

    ## Rate limits

    Authentication endpoints allow 10 requests per 15 minutes per IP. All
    other endpoints share a limit of 300 requests per 15 minutes per IP. The
    API returns `429` when a limit is exceeded.

    ## cURL examples

    The request samples use `$API_URL` for the deployment origin and `$TOKEN`
    for a bearer token. For the live Render deployment:

    ```bash
    export API_URL="https://your-service.onrender.com"
    export TOKEN="<token returned by /api/v1/auth/login>"
    ```
  contact:
    name: enjz API
    url: https://github.com/bish87/enjz-api
  license:
    name: ISC
    identifier: ISC

servers:
  - url: /api/v1
    description: Current server

tags:
  - name: Health
    description: Service and database health checks.
  - name: Auth
    description: Registration, login, password reset, and session management.
  - name: Users
    description: Customer and provider account profiles.
  - name: Services
    description: Service categories and coverage areas used for provider discovery and bookings.
  - name: Providers
    description: Public provider discovery and provider self-service.
  - name: Bookings
    description: Booking creation, lifecycle transitions, and customer reviews.
  - name: Reviews
    description: Public provider reviews and administrative moderation.
  - name: Admin
    description: Administrative provider verification, booking oversight, and account support.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Check API health
      description: Verifies that the API process can reach PostgreSQL. Returns `503` when the database is unavailable.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API and database are healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                healthy:
                  value:
                    status: ok
                    db: up
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: The database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                unavailable:
                  value:
                    status: error
                    db: down
      x-codeSamples:
        - lang: curl
          label: Check health
          source: |
            curl "$API_URL/api/v1/health"

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer or provider
      description: |
        Creates an active account and returns a JWT. Provider accounts also get
        a pending provider profile that must be completed and verified by an
        administrator before appearing in public search.

        Phone numbers are normalized to `+249` format. Emails are lowercased.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              customer:
                summary: Customer registration
                value:
                  firstName: Ahmed
                  lastName: Ali
                  phone: "0912345678"
                  email: ahmed@example.com
                  city: Khartoum
                  password: Passw0rd!
                  role: CUSTOMER
              provider:
                summary: Provider registration
                value:
                  firstName: Sara
                  lastName: Hassan
                  phone: "+249912345679"
                  city: Omdurman
                  password: Passw0rd!
                  role: PROVIDER
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              examples:
                customer:
                  $ref: "#/components/examples/AuthResponse"
                provider:
                  $ref: "#/components/examples/ProviderAuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Register a customer
          source: |
            curl -X POST "$API_URL/api/v1/auth/register" \
              -H "Content-Type: application/json" \
              -d '{
                "firstName": "Ahmed",
                "lastName": "Ali",
                "phone": "0912345678",
                "email": "ahmed@example.com",
                "city": "Khartoum",
                "password": "Passw0rd!",
                "role": "CUSTOMER"
              }'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Authenticates with a phone number and password. Five failed attempts for
        the same phone and IP within 15 minutes trigger a temporary lockout.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              login:
                value:
                  phone: "+249912345678"
                  password: Passw0rd!
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              examples:
                success:
                  $ref: "#/components/examples/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid phone number or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidCredentials:
                  value:
                    message: Invalid phone or password
        "403":
          description: Account is pending approval or suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                pending:
                  value:
                    message: Account pending approval
                suspended:
                  value:
                    message: Account suspended
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Log in
          source: |
            curl -X POST "$API_URL/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"phone":"+249912345678","password":"Passw0rd!"}'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset
      description: |
        Always returns `200` to prevent account enumeration. If the account has
        an email address, a single-use reset link valid for 30 minutes is sent.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
            examples:
              request:
                value:
                  phone: "+249912345678"
      responses:
        "200":
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                accepted:
                  value:
                    message: If an account matches, a reset link has been sent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Request a reset link
          source: |
            curl -X POST "$API_URL/api/v1/auth/forgot-password" \
              -H "Content-Type: application/json" \
              -d '{"phone":"+249912345678"}'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset a password
      description: |
        Consumes a reset token and sets a new password. All existing sessions
        are revoked. Reset tokens are single-use and expire after 30 minutes.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            examples:
              request:
                value:
                  token: 8c4f7f0c7d4a4a4c9f3b2e1d0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b
                  newPassword: NewPassw0rd!
      responses:
        "200":
          description: Password reset successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                success:
                  value:
                    message: Password reset successful. Please sign in again.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Reset a password
          source: |
            curl -X POST "$API_URL/api/v1/auth/reset-password" \
              -H "Content-Type: application/json" \
              -d '{
                "token": "<reset-token>",
                "newPassword": "NewPassw0rd!"
              }'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current user
      description: Returns the authenticated user's account record.
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionResponse"
              examples:
                currentUser:
                  $ref: "#/components/examples/UserSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Get current user
          source: |
            curl "$API_URL/api/v1/auth/me" \
              -H "Authorization: Bearer $TOKEN"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: |
        Revokes every existing session for the authenticated account by
        incrementing the user's token version.
      operationId: logout
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                success:
                  value:
                    message: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Log out
          source: |
            curl -X POST "$API_URL/api/v1/auth/logout" \
              -H "Authorization: Bearer $TOKEN"

  /auth/password:
    post:
      tags: [Auth]
      summary: Change the current password
      description: |
        Verifies the current password, sets a new one, and revokes every
        existing session.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            examples:
              request:
                value:
                  currentPassword: Passw0rd!
                  newPassword: NewPassw0rd!
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                success:
                  value:
                    message: Password changed. Please sign in again.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                wrongPassword:
                  value:
                    message: Current password is incorrect
                invalidToken:
                  $ref: "#/components/examples/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Change password
          source: |
            curl -X POST "$API_URL/api/v1/auth/password" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "currentPassword": "Passw0rd!",
                "newPassword": "NewPassw0rd!"
              }'

  /users/profile:
    get:
      tags: [Users]
      summary: Get the current profile
      description: Returns the authenticated user's profile.
      operationId: getProfile
      responses:
        "200":
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionResponse"
              examples:
                profile:
                  $ref: "#/components/examples/UserSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Get profile
          source: |
            curl "$API_URL/api/v1/users/profile" \
              -H "Authorization: Bearer $TOKEN"
    patch:
      tags: [Users]
      summary: Update the current profile
      description: Updates the authenticated user's first name, last name, or city.
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
            examples:
              request:
                value:
                  firstName: Ahmed
                  lastName: Ali
                  city: Omdurman
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionResponse"
              examples:
                updated:
                  $ref: "#/components/examples/UserSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Update profile
          source: |
            curl -X PATCH "$API_URL/api/v1/users/profile" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"firstName":"Ahmed","lastName":"Ali","city":"Omdurman"}'

  /categories:
    get:
      tags: [Services]
      summary: List service categories
      description: Returns every service category, ordered by name.
      operationId: listCategories
      security: []
      responses:
        "200":
          description: Category list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
              examples:
                categories:
                  value:
                    categories:
                      - id: 1
                        name: Plumbing
                        createdAt: "2026-10-27T12:44:12.000Z"
                      - id: 2
                        name: Cleaning
                        createdAt: "2026-10-27T12:44:12.000Z"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: List categories
          source: |
            curl "$API_URL/api/v1/categories"
    post:
      tags: [Services]
      summary: Create a service category
      description: Creates a category. Requires the `ADMIN` role.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
            examples:
              request:
                value:
                  name: Carpentry
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
              examples:
                created:
                  value:
                    category:
                      id: 11
                      name: Carpentry
                      createdAt: "2026-11-05T09:15:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Create a category
          source: |
            curl -X POST "$API_URL/api/v1/categories" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"Carpentry"}'

  /categories/new:
    post:
      tags: [Services]
      summary: Create a service category (legacy alias)
      description: |
        Legacy alias for `POST /categories`. Requires the `ADMIN` role.
      operationId: createCategoryLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
            examples:
              request:
                value:
                  name: Carpentry
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
              examples:
                created:
                  value:
                    category:
                      id: 11
                      name: Carpentry
                      createdAt: "2026-11-05T09:15:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Create a category (legacy path)
          source: |
            curl -X POST "$API_URL/api/v1/categories/new" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"Carpentry"}'

  /categories/{id}:
    delete:
      tags: [Services]
      summary: Delete a service category
      description: |
        Deletes a category. Requires the `ADMIN` role. Returns `409` when the
        category is still referenced by providers or bookings.
      operationId: deleteCategory
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Category deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
              examples:
                deleted:
                  value:
                    category:
                      id: 11
                      name: Carpentry
                      createdAt: "2026-11-05T09:15:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Delete a category
          source: |
            curl -X DELETE "$API_URL/api/v1/categories/11" \
              -H "Authorization: Bearer $TOKEN"

  /areas:
    get:
      tags: [Services]
      summary: List coverage areas
      description: Returns coverage areas, optionally filtered by state.
      operationId: listAreas
      security: []
      parameters:
        - name: state
          in: query
          required: false
          description: Case-insensitive state name.
          schema:
            type: string
            maxLength: 100
          example: Khartoum
      responses:
        "200":
          description: Area list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaList"
              examples:
                areas:
                  value:
                    areas:
                      - id: 1
                        name: Khartoum
                        state: Khartoum
                      - id: 2
                        name: Omdurman
                        state: Khartoum
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: List areas
          source: |
            curl "$API_URL/api/v1/areas?state=Khartoum"
    post:
      tags: [Services]
      summary: Create a coverage area
      description: Creates an area. Requires the `ADMIN` role.
      operationId: createArea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaRequest"
            examples:
              request:
                value:
                  name: Atbara
                  state: River Nile
      responses:
        "201":
          description: Area created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
              examples:
                created:
                  value:
                    area:
                      id: 16
                      name: Atbara
                      state: River Nile
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Create an area
          source: |
            curl -X POST "$API_URL/api/v1/areas" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"Atbara","state":"River Nile"}'

  /areas/{id}:
    delete:
      tags: [Services]
      summary: Delete a coverage area
      description: |
        Deletes an area. Requires the `ADMIN` role. Returns `409` when the area
        is still referenced by providers or bookings.
      operationId: deleteArea
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Area deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
              examples:
                deleted:
                  value:
                    area:
                      id: 16
                      name: Atbara
                      state: River Nile
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Delete an area
          source: |
            curl -X DELETE "$API_URL/api/v1/areas/16" \
              -H "Authorization: Bearer $TOKEN"

  /providers:
    get:
      tags: [Providers]
      summary: Discover providers
      description: |
        Returns verified, active providers ordered by rating. Supports category,
        area, text search, and availability filters.
      operationId: listProviders
      security: []
      parameters:
        - name: categoryId
          in: query
          required: false
          description: Filter by service category ID.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: areaId
          in: query
          required: false
          description: Filter by coverage area ID.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: search
          in: query
          required: false
          description: Case-insensitive search across name and bio.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: plumbing
        - name: available
          in: query
          required: false
          description: Filter by current availability.
          schema:
            type: string
            enum: ["true", "false"]
          example: "true"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Provider list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
              examples:
                providers:
                  value:
                    data:
                      - id: 7
                        firstName: Sara
                        lastName: Hassan
                        avatar: null
                        city: Omdurman
                        bio: Licensed plumber with 8 years of experience.
                        experienceYears: 8
                        startingPrice: 15000
                        isAvailable: true
                        ratingAvg: 4.8
                        ratingCount: 12
                        categories:
                          - id: 1
                            name: Plumbing
                            price: 15000
                        areas:
                          - id: 2
