      description: |
        Sets a new password for an account without requiring the current
        password. Intended for users who cannot receive email. Requires the
        `ADMIN` role. All existing sessions are revoked.
      operationId: adminResetPassword
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResetPasswordRequest"
            examples:
              request:
                value:
                  newPassword: NewPassw0rd!
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionResponse"
              examples:
                user:
                  $ref: "#/components/examples/UserSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-codeSamples:
        - lang: curl
          label: Reset a user password
          source: |
            curl -X POST "$API_URL/api/v1/admin/users/12/reset-password" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"newPassword":"NewPassw0rd!"}'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by `POST /auth/login` or `POST /auth/register`.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Numeric resource ID.
      schema:
        type: integer
        minimum: 1
      example: 42
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Number of items per page. Maximum 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
      example: 10
    BookingStatus:
      name: status
      in: query
      required: false
      description: Filter by booking status.
      schema:
        type: string
        enum: [PENDING, ACCEPTED, DECLINED, COMPLETED, CANCELLED]
      example: PENDING

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Resource not found

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
                example: phone
              message:
                type: string
                example: Invalid phone number

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Operation completed successfully.

    Health:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok, error]
          example: ok
        db:
          type: string
          enum: [up, down]
          example: up

    User:
      type: object
      required: [id, firstName, phone, city, role, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 12
        firstName:
          type: string
          example: Ahmed
        lastName:
          type: [string, "null"]
          example: Ali
        phone:
          type: string
          example: "+249912345678"
        email:
          type: [string, "null"]
          format: email
          example: ahmed@example.com
        avatar:
          type: [string, "null"]
          format: uri
          example: null
        city:
          type: string
          example: Khartoum
        role:
          type: string
          enum: [CUSTOMER, PROVIDER, ADMIN]
          example: CUSTOMER
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, PENDING]
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          example: "2026-11-01T08:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-01T08:00:00.000Z"

    UserSession:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [tokenVersion]
          properties:
            tokenVersion:
              type: integer
              readOnly: true
              description: Internal session version used to revoke JWT sessions.
              example: 0

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        message:
          type: string
          example: Provider account created. Complete your profile and wait for admin verification.

    UserSessionResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserSession"

    Category:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Plumbing
        createdAt:
          type: string
          format: date-time
          example: "2026-10-27T12:44:12.000Z"

    CategoryList:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CategoryResponse:
      type: object
      required: [category]
      properties:
        category:
          $ref: "#/components/schemas/Category"

    Area:
      type: object
      required: [id, name, state]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Khartoum
        state:
          type: string
          example: Khartoum

    AreaList:
      type: object
      required: [areas]
      properties:
        areas:
          type: array
          items:
            $ref: "#/components/schemas/Area"

    AreaResponse:
      type: object
      required: [area]
      properties:
        area:
          $ref: "#/components/schemas/Area"

    ProviderCategory:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Plumbing
        price:
          type: [integer, "null"]
          example: 15000

    ProviderPublic:
      type: object
      required:
        [
          id,
          firstName,
          city,
          isAvailable,
          ratingAvg,
          ratingCount,
          categories,
          areas,
        ]
      properties:
        id:
          type: integer
          description: Provider user ID.
          example: 7
        firstName:
          type: string
          example: Sara
        lastName:
          type: [string, "null"]
          example: Hassan
        avatar:
          type: [string, "null"]
          format: uri
          example: null
        city:
          type: string
          example: Omdurman
        bio:
          type: [string, "null"]
          example: Licensed plumber with 8 years of experience.
        experienceYears:
          type: [integer, "null"]
          example: 8
        startingPrice:
          type: [integer, "null"]
          description: Starting price in whole SDG.
          example: 15000
        isAvailable:
          type: boolean
          example: true
        ratingAvg:
          type: number
          format: float
          example: 4.8
        ratingCount:
          type: integer
          example: 12
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ProviderCategory"
        areas:
          type: array
          items:
            $ref: "#/components/schemas/Area"

    ProviderList:
      type: object
