          $ref: "#/components/schemas/AdminUser"
        bio:
          type: [string, "null"]
          example: Licensed plumber with 8 years of experience.
        experienceYears:
          type: [integer, "null"]
          example: 8
        startingPrice:
          type: [integer, "null"]
