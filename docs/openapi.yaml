          id: 7
          firstName: Sara
          lastName: Hassan
          phone: "+249912345679"
          email: null
          avatar: null
          city: Omdurman
          role: PROVIDER
          status: ACTIVE
          createdAt: "2026-11-01T08:00:00.000Z"
          updatedAt: "2026-11-01T08:00:00.000Z"
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        message: Provider account created. Complete your profile and wait for admin verification.

    UserSessionResponse:
      summary: Current user
      value:
        user:
          id: 12
          firstName: Ahmed
          lastName: Ali
          phone: "+249912345678"
          email: ahmed@example.com
          avatar: null
          city: Khartoum
          role: CUSTOMER
