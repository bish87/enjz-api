    ReviewList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ReviewResponse:
      type: object
      required: [review]
      properties:
        review:
          $ref: "#/components/schemas/Review"

    AdminReview:
      type: object
      required: [id, bookingId, customerId, providerId, rating, createdAt]
      properties:
        id:
          type: integer
          example: 3
        bookingId:
          type: integer
          example: 42
        customerId:
          type: integer
          example: 12
        providerId:
          type: integer
          example: 7
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: [string, "null"]
          example: Arrived on time and fixed the leak quickly.
        createdAt:
          type: string
          format: date-time
          example: "2026-11-04T16:30:00.000Z"

    AdminReviewResponse:
      type: object
      required: [review]
      properties:
        review:
          $ref: "#/components/schemas/AdminReview"

    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 24
        totalPages:
          type: integer
          example: 3

    RegisterRequest:
      type: object
      required: [firstName, phone, city, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          example: Ahmed
        lastName:
          type: [string, "null"]
          maxLength: 50
          example: Ali
        phone:
          type: string
          description: Sudan phone number. Local, 249, and +249 formats are normalized.
          example: "0912345678"
        email:
          type: [string, "null"]
          format: email
          example: ahmed@example.com
        city:
          type: string
          minLength: 1
          maxLength: 100
          example: Khartoum
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: Passw0rd!
        role:
          type: string
          enum: [CUSTOMER, PROVIDER]
          default: CUSTOMER
          example: CUSTOMER

