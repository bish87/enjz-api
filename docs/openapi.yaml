          example: VERIFIED
        note:
          type: string
          maxLength: 500
          example: Identity documents could not be verified.

    AdminResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: NewPassw0rd!

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          examples:
            validation:
              $ref: "#/components/examples/ValidationError"

    Unauthorized:
      description: Missing, malformed, expired, or revoked bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthorized:
              $ref: "#/components/examples/Unauthorized"

    Forbidden:
      description: The account does not have the required role or is not active.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              $ref: "#/components/examples/Forbidden"

    NotFound:
      description: The requested resource was not found or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notFound:
              $ref: "#/components/examples/NotFound"

    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            conflict:
              $ref: "#/components/examples/Conflict"

    TooManyRequests:
      description: Rate limit or login lockout exceeded.
      headers:
        RateLimit:
          description: Rate limit status.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            tooManyRequests:
              $ref: "#/components/examples/TooManyRequests"

    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            serverError:
              $ref: "#/components/examples/InternalServerError"

  examples:
    AuthResponse:
      summary: Authenticated user
      value:
        user:
          id: 12
          firstName: Ahmed
          lastName: Ali
          phone: "+249912345678"
          email: ahmed@example.com
          avatar: null
          city: Khartoum
          role: CUSTOMER
          status: ACTIVE
          createdAt: "2026-11-01T08:00:00.000Z"
          updatedAt: "2026-11-01T08:00:00.000Z"
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

